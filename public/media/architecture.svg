<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TenderLoop architecture</title>
  <desc id="desc">Student, parent, and caregiver experiences pass through identity and deterministic authorization before bounded agents and typed tools can change family data.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#789085"/></marker>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#253D34" flood-opacity=".09"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#F7F3EB"/>
  <text x="88" y="85" fill="#18231F" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Bounded agents. Deterministic authority.</text>
  <text x="88" y="126" fill="#5C6A64" font-family="Arial, Helvetica, sans-serif" font-size="20">The model proposes. Identity, consent, policy, and typed tools decide what may happen.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="203" fill="#66756E" font-size="14" font-weight="700" letter-spacing="1.6">FAMILY EXPERIENCES</text>
    <g filter="url(#shadow)">
      <rect x="88" y="230" width="248" height="106" rx="20" fill="#FFFDF8"/>
      <circle cx="126" cy="268" r="17" fill="#DDEBE3"/><text x="126" y="274" text-anchor="middle" fill="#265D49" font-size="16" font-weight="700">S</text>
      <text x="157" y="269" fill="#18231F" font-size="21" font-weight="700">Student</text><text x="112" y="308" fill="#66756E" font-size="15">Private coaching + approvals</text>
      <rect x="88" y="356" width="248" height="106" rx="20" fill="#FFFDF8"/>
      <circle cx="126" cy="394" r="17" fill="#F1DDD0"/><text x="126" y="400" text-anchor="middle" fill="#754A36" font-size="16" font-weight="700">P</text>
      <text x="157" y="395" fill="#18231F" font-size="21" font-weight="700">Parent</text><text x="112" y="434" fill="#66756E" font-size="15">Approved requests + decisions</text>
      <rect x="88" y="482" width="248" height="106" rx="20" fill="#FFFDF8"/>
      <circle cx="126" cy="520" r="17" fill="#DDE9EF"/><text x="126" y="526" text-anchor="middle" fill="#385D6C" font-size="16" font-weight="700">C</text>
      <text x="157" y="521" fill="#18231F" font-size="21" font-weight="700">Caregiver</text><text x="112" y="560" fill="#66756E" font-size="15">Expiring logistics-only pass</text>
    </g>

    <path d="M336 283H410M336 409H410M336 535H410" stroke="#789085" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="414" y="203" fill="#66756E" font-size="14" font-weight="700" letter-spacing="1.6">IDENTITY + API</text>
    <g filter="url(#shadow)">
      <rect x="410" y="230" width="238" height="358" rx="24" fill="#EAF1ED"/>
      <rect x="438" y="262" width="182" height="86" rx="17" fill="#FFFDF8"/><text x="529" y="298" text-anchor="middle" fill="#18231F" font-size="19" font-weight="700">Amazon Cognito</text><text x="529" y="324" text-anchor="middle" fill="#66756E" font-size="14">Verified identity</text>
      <path d="M529 348V378" stroke="#789085" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="438" y="382" width="182" height="86" rx="17" fill="#FFFDF8"/><text x="529" y="418" text-anchor="middle" fill="#18231F" font-size="19" font-weight="700">API Gateway</text><text x="529" y="444" text-anchor="middle" fill="#66756E" font-size="14">Lambda role router</text>
      <path d="M529 468V498" stroke="#789085" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="438" y="502" width="182" height="58" rx="17" fill="#265D49"/><text x="529" y="538" text-anchor="middle" fill="#FFFDF8" font-size="17" font-weight="700">JWT + family scope</text>
    </g>

    <path d="M648 409H706" stroke="#789085" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="710" y="203" fill="#66756E" font-size="14" font-weight="700" letter-spacing="1.6">AGENTCORE RUNTIME</text>
    <g filter="url(#shadow)">
      <rect x="706" y="230" width="350" height="358" rx="24" fill="#FFFDF8"/>
      <text x="881" y="272" text-anchor="middle" fill="#18231F" font-size="22" font-weight="700">Strands orchestration</text>
      <text x="881" y="299" text-anchor="middle" fill="#66756E" font-size="14">Separate prompts + tool allowlists</text>
      <rect x="738" y="329" width="286" height="76" rx="16" fill="#E6F0E9"/><text x="881" y="361" text-anchor="middle" fill="#265D49" font-size="18" font-weight="700">Student Coach Agent</text><text x="881" y="384" text-anchor="middle" fill="#577068" font-size="13">Plan · teach · draft Help Card</text>
      <rect x="738" y="421" width="286" height="76" rx="16" fill="#F6E8DF"/><text x="881" y="453" text-anchor="middle" fill="#754A36" font-size="18" font-weight="700">Parent Guide Agent</text><text x="881" y="476" text-anchor="middle" fill="#715F56" font-size="13">Explain · suggest · draft response</text>
      <rect x="738" y="513" width="286" height="48" rx="16" fill="#EDF3F6"/><text x="881" y="543" text-anchor="middle" fill="#385D6C" font-size="15" font-weight="700">Caregiver service — no general agent</text>
    </g>

    <path d="M1056 409H1116" stroke="#789085" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="1120" y="203" fill="#66756E" font-size="14" font-weight="700" letter-spacing="1.6">POLICY + ACTIONS</text>
    <g filter="url(#shadow)">
      <rect x="1116" y="230" width="396" height="358" rx="24" fill="#EAF0F3"/>
      <rect x="1148" y="262" width="332" height="80" rx="17" fill="#2E5968"/><text x="1314" y="295" text-anchor="middle" fill="#FFFDF8" font-size="19" font-weight="700">Cedar authorization gate</text><text x="1314" y="320" text-anchor="middle" fill="#DDE9EF" font-size="13">Role · consent · scope · expiry · approval hash</text>
      <path d="M1314 342V370" stroke="#789085" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="1148" y="374" width="332" height="72" rx="17" fill="#FFFDF8"/><text x="1314" y="404" text-anchor="middle" fill="#18231F" font-size="18" font-weight="700">Typed Lambda tools</text><text x="1314" y="427" text-anchor="middle" fill="#66756E" font-size="13">Validate · version · idempotency · audit</text>
      <path d="M1314 446V474" stroke="#789085" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="1148" y="478" width="154" height="78" rx="17" fill="#FFFDF8"/><text x="1225" y="510" text-anchor="middle" fill="#18231F" font-size="17" font-weight="700">DynamoDB</text><text x="1225" y="534" text-anchor="middle" fill="#66756E" font-size="13">Shared objects</text>
      <rect x="1326" y="478" width="154" height="78" rx="17" fill="#FFFDF8"/><text x="1403" y="510" text-anchor="middle" fill="#18231F" font-size="17" font-weight="700">EventBridge</text><text x="1403" y="534" text-anchor="middle" fill="#66756E" font-size="13">Approved reminders</text>
    </g>

    <g transform="translate(88 650)">
      <rect width="1424" height="152" rx="24" fill="#263E35"/>
      <text x="35" y="42" fill="#DDEBE3" font-size="14" font-weight="700" letter-spacing="1.5">PRIVACY + SAFETY PLANE</text>
      <text x="35" y="82" fill="#FFFDF8" font-size="21" font-weight="700">Bedrock Guardrails</text><text x="35" y="110" fill="#BFD0C6" font-size="14">Content boundary</text>
      <line x1="270" y1="34" x2="270" y2="119" stroke="#557167"/>
      <text x="306" y="82" fill="#FFFDF8" font-size="21" font-weight="700">Ephemeral chat</text><text x="306" y="110" fill="#BFD0C6" font-size="14">No automatic health or mood memory</text>
      <line x1="620" y1="34" x2="620" y2="119" stroke="#557167"/>
      <text x="656" y="82" fill="#FFFDF8" font-size="21" font-weight="700">Consent receipts</text><text x="656" y="110" fill="#BFD0C6" font-size="14">Exact snapshot · audience · expiry</text>
      <line x1="958" y1="34" x2="958" y2="119" stroke="#557167"/>
      <text x="994" y="82" fill="#FFFDF8" font-size="21" font-weight="700">CloudWatch + AgentCore</text><text x="994" y="110" fill="#BFD0C6" font-size="14">Observability without private prompt bodies</text>
    </g>
  </g>
</svg>
