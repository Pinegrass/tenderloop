      <text x="944" y="553" text-anchor="middle" fill="#715F56" font-size="13">Draft plans; never auto-share</text>

      <rect x="1160" y="270" width="352" height="340" rx="26" fill="#EAF0F3"/>
      <rect x="1190" y="304" width="292" height="82" rx="18" fill="#2E5968"/>
      <text x="1336" y="338" text-anchor="middle" fill="#FFFDF8" font-size="19" font-weight="700">build_study_plan tool</text>
      <text x="1336" y="364" text-anchor="middle" fill="#DDE9EF" font-size="13">One typed, bounded capability</text>
