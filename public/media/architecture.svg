      <text x="1336" y="476" text-anchor="middle" fill="#66756E" font-size="13">Steps · timing · check-in · help</text>
      <path d="M1336 493V519" stroke="#789085" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="1190" y="523" width="292" height="54" rx="18" fill="#FFFDF8"/>
      <text x="1336" y="556" text-anchor="middle" fill="#18231F" font-size="17" font-weight="700">Rendered for review—not action</text>
    </g>

    <path d="M374 440H420" stroke="#789085" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M728 440H774" stroke="#789085" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1102 440H1148" stroke="#789085" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(88 664)">
      <rect width="1424" height="146" rx="24" fill="#263E35"/>
      <text x="30" y="37" fill="#DDEBE3" font-size="13" font-weight="700" letter-spacing="1.5">VERIFIED PRIVACY + DEPLOYMENT BOUNDARY</text>
      <text x="30" y="78" fill="#FFFDF8" font-size="19" font-weight="700">Synthetic demo data</text><text x="30" y="104" fill="#BFD0C6" font-size="13">No account or child data</text>
      <line x1="292" y1="30" x2="292" y2="116" stroke="#557167"/>
      <text x="326" y="78" fill="#FFFDF8" font-size="19" font-weight="700">Explicit share preview</text><text x="326" y="104" fill="#BFD0C6" font-size="13">Exact words before Help Card</text>
      <line x1="624" y1="30" x2="624" y2="116" stroke="#557167"/>
      <text x="658" y="78" fill="#FFFDF8" font-size="19" font-weight="700">No persistence</text><text x="658" y="104" fill="#BFD0C6" font-size="13">Current state stays in browser</text>
      <line x1="905" y1="30" x2="905" y2="116" stroke="#557167"/>
      <text x="939" y="68" fill="#FFFDF8" font-size="19" font-weight="700">Two honest runtime modes</text><text x="939" y="94" fill="#BFD0C6" font-size="13">Local AWS login → Strands + Nova Lite</text><text x="939" y="116" fill="#BFD0C6" font-size="13">Vercel without AWS credentials → safe preview</text>
    </g>
  </g>
</svg>
