<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TenderLoop implemented prototype architecture</title>
  <desc id="desc">The Next.js role-based family experience calls a validated coach route, which uses the Strands Agents SDK and Amazon Nova Lite to invoke a bounded study-plan tool and return structured output. Explicit approval remains in the user interface.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#789085"/></marker>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#253D34" flood-opacity=".1"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#F7F3EB"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="88" y="82" fill="#18231F" font-size="42" font-weight="700">TenderLoop prototype — implemented architecture</text>
    <text x="88" y="122" fill="#5C6A64" font-size="19">Everything shown below is running and verified in the current repository.</text>
    <g transform="translate(88 164)">
      <rect width="218" height="34" rx="17" fill="#DDEBE3"/>
      <circle cx="22" cy="17" r="6" fill="#347259"/>
      <text x="40" y="22" fill="#265D49" font-size="14" font-weight="700" letter-spacing="1">CURRENT PROTOTYPE</text>
    </g>

    <text x="88" y="246" fill="#66756E" font-size="14" font-weight="700" letter-spacing="1.6">FAMILY EXPERIENCE</text>
    <text x="432" y="246" fill="#66756E" font-size="14" font-weight="700" letter-spacing="1.6">VALIDATED API</text>
    <text x="786" y="246" fill="#66756E" font-size="14" font-weight="700" letter-spacing="1.6">AGENT RUNTIME</text>
    <text x="1160" y="246" fill="#66756E" font-size="14" font-weight="700" letter-spacing="1.6">BOUNDED RESULT</text>

    <g filter="url(#shadow)">
      <rect x="88" y="270" width="286" height="340" rx="26" fill="#FFFDF8"/>
      <rect x="112" y="294" width="238" height="76" rx="17" fill="#E7F0EA"/>
      <circle cx="143" cy="332" r="18" fill="#CFE2D6"/><text x="143" y="338" text-anchor="middle" fill="#265D49" font-size="16" font-weight="700">S</text>
      <text x="174" y="326" fill="#18231F" font-size="19" font-weight="700">Student · Maya</text><text x="174" y="350" fill="#5C6A64" font-size="13">Private planning workspace</text>
      <rect x="112" y="386" width="238" height="76" rx="17" fill="#F7E9DF"/>
      <circle cx="143" cy="424" r="18" fill="#F0D8C9"/><text x="143" y="430" text-anchor="middle" fill="#754A36" font-size="16" font-weight="700">P</text>
      <text x="174" y="418" fill="#18231F" font-size="19" font-weight="700">Parent · Daniel</text><text x="174" y="442" fill="#5C6A64" font-size="13">Approved Help Cards only</text>
      <rect x="112" y="478" width="238" height="76" rx="17" fill="#EDF3F6"/>
      <circle cx="143" cy="516" r="18" fill="#D8E6EC"/><text x="143" y="522" text-anchor="middle" fill="#385D6C" font-size="16" font-weight="700">C</text>
      <text x="174" y="510" fill="#18231F" font-size="19" font-weight="700">Caregiver · Alex</text><text x="174" y="534" fill="#5C6A64" font-size="13">Expiring logistics view</text>
      <text x="231" y="585" text-anchor="middle" fill="#66756E" font-size="14" font-weight="700">Next.js 16 · React · TypeScript</text>

